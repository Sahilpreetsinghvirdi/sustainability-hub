name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag"
        required: true
        default: "v1.4.6"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-35
            platforms;android-36
            build-tools;35.0.0
            build-tools;36.0.0

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Prepare Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build signed APK
        working-directory: mobile
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias sustainability -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=ELARA, OU=ISC, O=ELARA, L=City, S=State, C=IN" -noprompt
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=sustainability" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=android" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=android" >> android/gradle.properties
          npx expo export --platform android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        working-directory: mobile
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ELARA-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELARA-APK
          path: mobile/dist/*.apk
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ELARA-Windows
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs:
      - build-apk
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ELARA-APK
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ELARA-Windows
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          name: ELARA ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
          files: release-assets/**/*
          generate_release_notes: true
          prerelease: false
