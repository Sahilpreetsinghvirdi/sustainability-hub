name: Mobile APK

on:
  push:
    tags:
      - "mobile-v*"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. mobile-v1.0.0)"
        required: false
        default: "mobile-v1.0.0"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK (debug - installable)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        working-directory: mobile
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SustainabilityHub-${{ github.ref_name || inputs.version }}.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SustainabilityHub-APK
          path: mobile/dist/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/dist/*.apk
          generate_release_notes: true
          prerelease: false

      - name: Create release for manual dispatch
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: mobile/dist/*.apk
          generate_release_notes: true
          prerelease: false
