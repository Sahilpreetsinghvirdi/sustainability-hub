<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#ECFDF5"/>
      <stop offset="70%" stop-color="#BBF7D0"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="leafEdge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#15803D" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#fff" flood-opacity="0.3"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle inner border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="105" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Leaf group -->
  <g transform="translate(256, 248) rotate(-12)" filter="url(#shadow)">
    <!-- Leaf body - organic shape -->
    <path d="
      M 0,-140
      C -30,-135 -70,-115 -100,-80
      C -130,-45 -145,10 -135,70
      C -125,130 -85,165 -30,170
      C -5,172 15,165 30,155
      C 55,138 85,105 100,65
      C 115,25 115,-30 100,-75
      C 85,-115 45,-140 0,-140
      Z
    " fill="url(#leafGrad)" stroke="url(#leafEdge)" stroke-width="1.5"/>

    <!-- Leaf highlight (top shine) -->
    <path d="
      M 0,-130
      C -25,-125 -55,-110 -78,-82
      C -95,-60 -108,-28 -110,10
      C -80,-30 -40,-75 0,-90
      C 40,-75 80,-30 110,10
      C 108,-28 95,-60 78,-82
      C 55,-110 25,-125 0,-130
      Z
    " fill="#fff" opacity="0.25"/>

    <!-- Central vein - main stem line -->
    <path d="M 0,-125 C 2,-80 3,-20 2,50 C 1,100 0,145 -2,165"
      stroke="#15803D" stroke-width="4.5" fill="none" opacity="0.5" stroke-linecap="round"/>

    <!-- Central vein highlight -->
    <path d="M 0.5,-120 C 2.5,-75 3.5,-15 2.5,55"
      stroke="#fff" stroke-width="1.5" fill="none" opacity="0.3" stroke-linecap="round"/>

    <!-- Side veins - left -->
    <path d="M 1,-80 C -20,-60 -50,-35 -72,-10" stroke="#15803D" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M 1.5,-35 C -15,-18 -38,2 -55,22" stroke="#15803D" stroke-width="2.8" fill="none" opacity="0.28" stroke-linecap="round"/>
    <path d="M 1,15 C -12,30 -30,48 -42,62" stroke="#15803D" stroke-width="2.5" fill="none" opacity="0.25" stroke-linecap="round"/>
    <path d="M 0.5,60 C -10,72 -22,85 -30,95" stroke="#15803D" stroke-width="2" fill="none" opacity="0.2" stroke-linecap="round"/>

    <!-- Side veins - right -->
    <path d="M 1,-65 C 22,-48 48,-25 68,-2" stroke="#15803D" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>
    <path d="M 1.5,-20 C 18,-5 40,15 55,35" stroke="#15803D" stroke-width="2.8" fill="none" opacity="0.28" stroke-linecap="round"/>
    <path d="M 1,30 C 14,45 32,60 42,72" stroke="#15803D" stroke-width="2.5" fill="none" opacity="0.25" stroke-linecap="round"/>
    <path d="M 0.5,72 C 8,82 18,92 24,100" stroke="#15803D" stroke-width="2" fill="none" opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- Stem -->
  <path d="M 254,400 C 252,415 248,435 240,450 C 235,460 228,468 220,472"
    stroke="url(#stemGrad)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Small drop of water on leaf -->
  <ellipse cx="285" cy="205" rx="6" ry="8" fill="#fff" opacity="0.35" transform="rotate(-15, 285, 205)"/>
  <ellipse cx="285" cy="204" rx="3" ry="4" fill="#fff" opacity="0.5" transform="rotate(-15, 285, 204)"/>
</svg>
