    <path d="M0,-15 C20,5 45,28 55,50" stroke="#22C55E" stroke-width="3" fill="none" opacity="0.25" stroke-linecap="round"/>
    <path d="M0,35 C-22,52 -45,68 -50,80" stroke="#22C55E" stroke-width="3" fill="none" opacity="0.25" stroke-linecap="round"/>
    <path d="M0,75 C15,88 35,100 42,108" stroke="#22C55E" stroke-width="2.5" fill="none" opacity="0.2" stroke-linecap="round"/>
  </g>
</svg>