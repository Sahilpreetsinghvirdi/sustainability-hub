[package]
name = "sustainability-hub-desktop"
version = "1.4.6"
description = "Sustainability Hub - Desktop Edition"
authors = ["Sahil Virdi"]
edition = "2021"

[lib]
name = "sustainability_hub_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
